<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff">
<title>SZ Studio — Roompi</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#191919;background:white}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}a{color:inherit;text-decoration:none}a:focus-visible{outline:3px solid #635db9;outline-offset:6px}
.studio-hero{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:58.7% 41.3%;}
.studio-art{min-width:0;overflow:hidden;background:#8783cb}.studio-art img{height:100%;width:100%;object-fit:cover;object-position:center;display:block}
.studio-intro{min-width:0;padding:clamp(34px,6vw,105px) clamp(26px,5.3vw,95px) clamp(36px,5vw,75px);display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:48px}
.intro-heading{align-self:stretch;width:100%;max-width:470px;font-style:italic;font-size:clamp(22px,2.05vw,33px);line-height:1.42;letter-spacing:-.02em}.intro-heading p{margin:0 0 24px}
.showcase{width:min(100%,470px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(15px,3vw,45px);row-gap:28px;align-items:center;text-align:center}
.product{display:flex;align-items:center;flex-direction:column;gap:18px;min-width:0}.product-label{font-size:clamp(17px,1.35vw,23px);font-style:italic;white-space:nowrap}.product-art{display:block;width:100%;aspect-ratio:1/1;max-width:200px;border-radius:18px;overflow:hidden;transition:transform .24s ease,box-shadow .24s ease}.product-art img{display:block;width:100%;height:100%;object-fit:fill}.product-art:hover{transform:translateY(-6px);box-shadow:0 12px 25px #0002}.market-link{display:flex;justify-content:center;align-items:center;min-height:85px;transition:transform .2s ease}.market-link:hover{transform:translateY(-4px)}.market-link svg{width:min(100%,140px);height:80px}.itch-logo{font-weight:900;font-size:clamp(18px,1.8vw,27px);letter-spacing:-.055em;white-space:nowrap}.itch-logo .store{font-size:1.27em;margin-right:5px}
.team{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:47% 6% 47%;align-items:center;padding:clamp(45px,7vw,120px) clamp(24px,10vw,170px);gap:0}.team-left{align-self:center}.team-title{font-size:clamp(70px,8vw,135px);line-height:1.1;letter-spacing:-.055em;font-weight:400;margin:0 0 45px}.team-logo{display:block;width:clamp(125px,11vw,190px);height:auto}.team-divider{width:12px;height:min(60vh,555px);border-radius:20px;background:#c9c9c9;margin:auto}.team-right{font-style:italic;padding-left:clamp(15px,2vw,38px)}.team-right h2{font-size:clamp(38px,3.5vw,61px);font-weight:400;margin:0 0 2px;line-height:1.1}.lead-name{font-size:clamp(27px,2.65vw,45px);margin:0}.contact{margin-top:clamp(90px,12vh,160px)}.contact h3{font-size:clamp(39px,3.5vw,60px);font-weight:400;margin:0 0 18px}.contact p{font-size:clamp(22px,2.3vw,37px);margin:0 0 40px}.email{font-size:clamp(21px,2.25vw,37px);overflow-wrap:anywhere}.email:hover{text-decoration:underline}.back-link{position:fixed;bottom:17px;right:22px;background:#fffde9e8;border:1px solid #0002;border-radius:999px;padding:10px 18px;font-size:13px;opacity:.7;z-index:10;transition:opacity .2s}.back-link:hover{opacity:1}
@media(max-width:950px){.studio-hero{grid-template-columns:54% 46%}.studio-intro{padding:40px 25px}.intro-heading{font-size:24px}.showcase{column-gap:14px}.team{padding:60px 7vw;grid-template-columns:44% 5% 51%}.team-title{font-size:clamp(57px,7vw,90px)}.team-right{padding-left:24px}}
@media(max-width:650px){.studio-hero{display:flex;flex-direction:column}.studio-art{height: min(94vw,580px)}.studio-art img{object-fit:cover}.studio-intro{padding:52px 28px 65px;gap:58px}.intro-heading{max-width:440px;font-size:clamp(23px,5.2vw,30px)}.showcase{max-width:440px}.product-label{font-size:18px}.team{min-height:unset;padding:90px 28px;display:flex;align-items:stretch;flex-direction:column;gap:44px}.team-title{font-size:clamp(66px,16vw,102px);margin-bottom:25px}.team-logo{width:126px}.team-divider{width:100%;height:6px;min-height:6px}.team-right{padding:0}.team-right h2{font-size:42px}.lead-name{font-size:29px}.contact{margin-top:70px}.contact h3{font-size:42px}.contact p,.email{font-size:24px}.back-link{font-size:12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style></head>
