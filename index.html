<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Roompi — the hub platform for SZ Lab Property. Explore Red Tek, SZ Studio, and SZ Lab.">
  <title>Roompi — by SZ</title>
  <style>
    :root { color-scheme: light; --ink:#242424; --muted:#999; --gold:#ffe2a0; --border:#272727; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-width:320px; min-height:100vh; color:var(--ink); font-family:Arial,Helvetica,sans-serif; background:#fff; overflow-x:hidden; }
    body::before { content:""; position:fixed; pointer-events:none; z-index:-1; top:0; left:0; width:min(32vw,490px); height:100vh; background:#f4f4f4; clip-path:polygon(0 0,100% 0,0 100%); }
    .page { min-height:100vh; min-height:100svh; display:flex; align-items:center; justify-content:center; padding:clamp(44px,7vh,88px) 22px 7vh; }
    .content { width:min(100%,1010px); transform:translateY(10px); }
    .brand-block { width:min(100%,800px); margin:0 auto clamp(56px,10vh,110px); }
    .wordmark { position:relative; width:100%; height:clamp(120px,15.8vw,215px); }
    h1 { margin:0; position:absolute; left:0; top:0; font-size:clamp(76px,9.6vw,155px); line-height:1.09; font-style:italic; letter-spacing:-.085em; font-weight:900; color:var(--gold); -webkit-text-stroke:1.4px #222; paint-order:stroke fill; }
    .by-sz { position:absolute; right:8%; bottom:0; font-size:clamp(29px,4.1vw,65px); line-height:1; font-style:italic; letter-spacing:-.05em; font-weight:900; white-space:nowrap; }
    .tagline { margin:0; padding-left:0; font-size:clamp(14px,1.45vw,22px); font-style:italic; letter-spacing:.015em; color:#999; font-weight:300; }
    .tiles { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(20px,2.8vw,45px); width:min(100%,868px); margin:auto; }
    .tile { appearance:none; display:block; cursor:pointer; padding:0; width:100%; aspect-ratio:1.275/1; border:1.7px solid #252525; border-radius:19px; overflow:hidden; background:#eee; box-shadow:none; transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease; }
    .tile img { display:block; width:100%; height:100%; object-fit:cover; }
    .tile:hover { transform:translateY(-7px); box-shadow:0 14px 28px #00000016; }
    .tile:active { transform:translateY(-2px) scale(.98); }
    .tile:focus-visible, .close:focus-visible { outline:3px solid #5b65c6; outline-offset:5px; }
    .tile:nth-child(2) img { object-position:center 46%; }
    .tile:nth-child(3) img { object-position:center 42%; }
    dialog { border:0; border-radius:24px; width:min(92vw,490px); padding:32px; color:var(--ink); box-shadow:0 24px 80px #0004; }
    dialog::backdrop { background:#1717178c; backdrop-filter:blur(7px); }
    dialog h2 { margin:6px 0 12px; font-size:35px; letter-spacing:-.05em; }
    dialog p { line-height:1.55; color:#555; margin:0 0 20px; }
    .dialog-header { display:flex; align-items:center; gap:15px; }
    .dialog-header img { width:72px; height:72px; object-fit:cover; border-radius:14px; border:1px solid #ddd; }
    .close { border:0; border-radius:99px; padding:11px 21px; background:#222; color:white; cursor:pointer; font:inherit; }
    .small-note { color:#888; font-size:12px; padding-top:18px; }
    @media (min-width:1300px) { .content { transform:translateY(22px); } }
    @media (max-width:680px) {
      .page { padding:64px 24px; align-items:center; }
      .content { transform:none; }
      .brand-block { margin-bottom:55px; }
      .wordmark { height:clamp(102px,20vw,150px); }
      h1 { font-size:clamp(62px,13vw,92px); letter-spacing:-.085em; }
      .by-sz { font-size:clamp(25px,6vw,39px); bottom:-3px; right:1%; }
      .tagline { font-size:clamp(12px,2.8vw,17px); }
      .tiles { grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; max-width:460px; }
      .tile { aspect-ratio:1/1; border-radius:16px; }
      .tile:last-child { grid-column:1/-1; width:calc(50% - 9px); justify-self:center; }
    }
    @media (max-width:400px) { .wordmark { height:101px; } h1 { font-size:61px; } .by-sz { font-size:25px; } .tiles { gap:12px; } .tile:last-child { width:calc(50% - 6px); } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="content">
      <header class="brand-block">
        <div class="wordmark"><h1>Roompi</h1><span class="by-sz">by SZ</span></div>
        <p class="tagline">hub platform for SZ Lab Property</p>
      </header>
      <nav class="tiles" aria-label="Explore SZ properties">
        <button class="tile" type="button" data-brand="redtek" aria-label="Explore Red Tek"><img src="assets/red-tek.png" alt="Red Tek logo"></button>
        <button class="tile" type="button" data-brand="studio" aria-label="Explore SZ Studio"><img src="assets/sz-studio.png" alt="SZ Studio logo"></button>
        <button class="tile" type="button" data-brand="lab" aria-label="Explore SZ Lab"><img src="assets/sz-lab.png" alt="SZ Lab logo"></button>
      </nav>
    </div>
  </main>
  <dialog id="brandDialog" aria-labelledby="dialogTitle">
    <div class="dialog-header"><img id="dialogImage" alt=""><h2 id="dialogTitle"></h2></div>
    <p id="dialogDescription"></p>
    <button class="close" type="button" id="closeDialog">Close</button>
    <div class="small-note">Replace this information popup with your project URL when your pages are ready.</div>
  </dialog>
  <script>
    const brands={
      redtek:{title:'Red Tek',image:'assets/red-tek.png',description:'Explore Red Tek, part of the SZ ecosystem.'},
      studio:{title:'SZ Studio',image:'assets/sz-studio.png',description:'Discover the creative work of SZ Studio.'},
      lab:{title:'SZ Lab',image:'assets/sz-lab.png',description:'Research and development at SZ Lab.'}
    };
    const dialog=document.getElementById('brandDialog');
    document.querySelectorAll('[data-brand]').forEach(button=>button.addEventListener('click',()=>{
      if(button.dataset.brand==='studio'){window.location.href='szstudio/';return;}
      const brand=brands[button.dataset.brand];
      document.getElementById('dialogTitle').textContent=brand.title;
      document.getElementById('dialogImage').src=brand.image;
      document.getElementById('dialogImage').alt=brand.title+' logo';
      document.getElementById('dialogDescription').textContent=brand.description;
      dialog.showModal();
    }));
    document.getElementById('closeDialog').addEventListener('click',()=>dialog.close());
    dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});
  </script>
</body>
</html>
